name: Build CrossConverter Windows Executable

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'cross_converter/**'
      - '.github/workflows/build_cross_converter.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'cross_converter/**'
      - '.github/workflows/build_cross_converter.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build CrossConverter Windows .exe
    runs-on: windows-latest

    defaults:
      run:
        working-directory: cross_converter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'cross_converter/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python test_converter.py

      - name: Build with PyInstaller
        run: |
          pyinstaller cross_converter.spec --clean --noconfirm

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossConverter-Windows-exe
          path: cross_converter/dist/CrossConverter.exe
          retention-days: 30

      - name: Create Release and Upload Asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cross_converter/dist/CrossConverter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
